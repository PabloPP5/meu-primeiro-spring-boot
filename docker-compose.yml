services:
  postgres:
    image: postgres:16-alpine
    container_name: tarefas-postgres
    environment:
      POSTGRES_DB: tarefasdb
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
    ports:
      - "5432:5432"
    volumes:
      - tarefas-postgres-data:/var/lib/postgresql/data

volumes:
  tarefas-postgres-data:
